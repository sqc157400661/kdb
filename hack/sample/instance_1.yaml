apiVersion: kdb.com/v1
kind: KDBInstance
metadata:
  name: kdb01
  namespace: kdb
  labels:
    app: kdb
spec:
  instance:
    metadata:
      labels:
        test: test1
      annotations:
        test2: test3
    replicas: 1
    runtimeClassName: runc
    mainContainer:
      #name: mysqld
      image: kdbdeveloper/mysql80:v0.0.7
      command:
        - /bin/bash
        - -c
        - /kdb/bin/run_supervisor.sh
      env:
        - name: ENV_VAR_NAME
          value: ENV_VAR_VALUE
      resources:
        requests:
          cpu: "0.1"
          memory: "256Mi"
        limits:
          cpu: "0.3"
          memory: "384Mi"
    sidecarContainer:
      #name: sidecar
      image: kdbdeveloper/mysql-sidecar:v0.0.10
      command:
        - /kdb/bin/start.sh
      env:
        - name: ENV_VAR_NAME
          value: ENV_VAR_VALUE
      resources:
        requests:
          cpu: "0.025"
          memory: "64Mi"
        limits:
          cpu: "0.1"
          memory: "128Mi"
    dataVolumeClaimSpec:
      storageClass: standard
      size: 1Gi
  port: 3306
  engine: MySQL
#  engine: MySQL
  deployArch: Single
  engineVersion: "8.0"
#  postgresFullVersion: "8.0.37"
  mysql:
    exporter:
      enabled: true
      image: kdbdeveloper/mysql-exporter:v0.0.1
      env:
        - name: MYSQL_EXPORTER_USER
          value: exporter
        - name: MYSQL_EXPORTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kdb01-monitor
              key: password
      resources:
        requests:
          cpu: "0.01"
          memory: "32Mi"
        limits:
          cpu: "0.05"
          memory: "64Mi"
  shutdown: false
  supplementalGroups:
    - 1000
  config:
    key1: value1
    key2: value2
