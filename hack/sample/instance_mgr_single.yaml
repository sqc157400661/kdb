apiVersion: kdb.com/v1
kind: KDBInstance
metadata:
  name: kdb-mgr-single
  namespace: kdb
  labels:
    app: kdb
spec:
  instance:
    metadata:
      labels:
        test: test1
      annotations:
        test2: test3
    replicas: 3
    runtimeClassName: runc
    mainContainer:
      image: kdbdeveloper/mysql80-mgr:v0.0.1
      command:
        - /bin/bash
        - -c
        - /kdb/bin/run_supervisor.sh
      env:
        - name: ENV_VAR_NAME
          value: ENV_VAR_VALUE
      resources:
        requests:
          cpu: "0.5"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
    sidecarContainer:
      image: kdbdeveloper/mysql-sidecar:v0.0.10
      command:
        - /kdb/bin/start.sh
      env:
        - name: ENV_VAR_NAME
          value: ENV_VAR_VALUE
      resources:
        requests:
          cpu: "0.1"
          memory: "100Mi"
        limits:
          cpu: "0.1"
          memory: "100Mi"
    dataVolumeClaimSpec:
      storageClass: standard
      size: 1Gi
  port: 3306
  engine: MySQL
  engineVersion: "8.0"
  deployArch: MGR
  mysql:
    mgr:
      mode: SinglePrimary
      bootstrapOrdinal: 0
      groupPort: 33061
  shutdown: false
  supplementalGroups:
    - 1000
  config:
    key1: value1
    key2: value2
